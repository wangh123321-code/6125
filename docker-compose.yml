services:
  mongodb:
    image: mongo:7-jammy
    container_name: swim_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - swim_network

  redis:
    image: redis:7-alpine
    container_name: swim_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass redis_password
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - swim_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: swim_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      MONGODB_URL: mongodb://root:password@mongodb:27017/swim_db?authSource=admin
      REDIS_URL: redis://:redis_password@redis:6379/0
      SECRET_KEY: your-super-secret-key-change-in-production-please-use-long-string-32chars
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - swim_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: swim_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - swim_network

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  swim_network:
    driver: bridge
